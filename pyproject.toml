[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-cognitive-agent"
version = "0.1.0"
description = "Autonomous cognitive architecture using LiteLLM, LanceDB, LangGraph, and FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40.0",
    "lancedb>=0.10.0",
    "langgraph>=0.2.0",
    "langchain-community>=0.3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
    "pyyaml>=6.0",
    "aiohttp>=3.10.0",
    "Pillow>=10.0.0",
    "mss>=9.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=6.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff==0.15.22",
    "pre-commit>=4.0",
    "yamllint>=1.35",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "*.pyc",
    "cognitivo/skills",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "N", "B", "SIM"]
ignore = ["E501", "B008", "SIM105", "W293", "B007", "SIM116", "N806", "SIM115", "SIM117", "UP035", "B023"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    "unit: Tests unitarios sin dependencias externas",
    "integration: Tests de integracion con broker real",
    "slow: Tests lentos (>5s)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["core", "cognitivo", "sentidos", "memoria"]
omit = ["*/test_*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "logger.",
]
